<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adobe PDF Embed Test</title>
</head>
<body>
    <div id="adobe-dc-view" style="height: 800px; width: 100%;"></div>
    <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
    <script type="text/javascript">
        document.addEventListener("adobe_dc_view_sdk.ready", function () {
            var adobeDCView = new AdobeDC.View({ clientId: "your_actual_api_key_here", divId: "adobe-dc-view" });
            adobeDCView.previewFile({
                content: { location: { url: "https://documentservices.adobe.com/view-sdk-demo/PDFs/Bodea Brochure.pdf" } },
                metaData: { fileName: "Bodea Brochure.pdf" }
            }, { embedMode: "FULL_WINDOW" });
        });
    </script>
</body>
</html>
